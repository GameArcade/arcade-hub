<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LinkWords — لنك وردز</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;800;900&family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#faf8f4;--bg2:#f0ece4;--card:#fff;--text:#18181b;--text2:#52525b;
  --muted:#a1a1aa;--accent:#e67e22;--accent2:#d35400;--border:#e4e4e7;
  --shadow:0 2px 8px rgba(0,0,0,0.04);--shadow-lg:0 8px 32px rgba(0,0,0,0.08);
  --yellow:#f59e0b;--yellow-bg:#fef9c3;--yellow-t:#92400e;
  --green:#22c55e;--green-bg:#dcfce7;--green-t:#166534;
  --blue:#3b82f6;--blue-bg:#dbeafe;--blue-t:#1e40af;
  --purple:#8b5cf6;--purple-bg:#ede9fe;--purple-t:#5b21b6;
  --red:#ef4444;--sel:#27272a;--sel-t:#fafafa;
  --r:10px;--r2:14px;
}
[data-theme=dark]{
  --bg:#18181b;--bg2:#27272a;--card:#27272a;--text:#fafafa;--text2:#a1a1aa;
  --muted:#71717a;--border:#3f3f46;--shadow:0 2px 8px rgba(0,0,0,0.2);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.4);
  --yellow-bg:#422006;--green-bg:#052e16;--blue-bg:#172554;--purple-bg:#2e1065;
  --yellow-t:#fde68a;--green-t:#bbf7d0;--blue-t:#bfdbfe;--purple-t:#ddd6fe;
  --sel:#fafafa;--sel-t:#18181b;
}
body{
  background:var(--bg);color:var(--text);
  font-family:'Manrope',sans-serif;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  user-select:none;-webkit-user-select:none;
  transition:background .25s,color .25s;
}
[dir=rtl] body{font-family:'IBM Plex Sans Arabic',sans-serif}
[dir=rtl] .en-only{display:none}
[dir=ltr] .ar-only{display:none}

.app{width:100%;max-width:520px;padding:10px 14px 30px;display:flex;flex-direction:column;gap:10px}

/* Top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.topbar-group{display:flex;gap:6px;align-items:center}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);
  background:var(--card);color:var(--text2);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:.85rem;transition:all .15s;font-family:inherit;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn:active{transform:scale(.92)}

/* Header */
.hdr{text-align:center;padding:2px 0 6px}
.hdr h1{
  font-family:'Fraunces',serif;font-size:2.4rem;font-weight:900;
  letter-spacing:-.5px;line-height:1;
  background:linear-gradient(135deg,var(--accent),#c0392b);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
[dir=rtl] .hdr h1{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:2.2rem;letter-spacing:0}
.hdr .sub{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:2.5px;text-transform:uppercase;margin-top:4px}

/* Stats strip */
.stats{
  display:flex;justify-content:center;gap:24px;
  padding:8px 16px;background:var(--card);border-radius:var(--r2);
  border:1px solid var(--border);box-shadow:var(--shadow);
}
.st{text-align:center}
.st-v{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:800;color:var(--accent)}
[dir=rtl] .st-v{font-family:'IBM Plex Sans Arabic',sans-serif}
.st-l{font-size:.58rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1.5px}

/* Difficulty */
.diff-row{display:flex;justify-content:center;gap:6px}
.diff-b{
  padding:5px 16px;border-radius:20px;border:1.5px solid var(--border);
  background:var(--card);font-family:inherit;font-size:.7rem;font-weight:700;
  color:var(--text2);cursor:pointer;transition:all .15s;
}
[dir=rtl] .diff-b{font-family:'IBM Plex Sans Arabic',sans-serif}
.diff-b:hover{border-color:var(--accent);color:var(--accent)}
.diff-b.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Lives */
.lives-row{display:flex;align-items:center;justify-content:center;gap:6px}
.lives-lbl{font-size:.72rem;font-weight:700;color:var(--muted)}
.life{
  width:20px;height:8px;border-radius:4px;background:var(--accent);
  transition:all .3s;
}
.life.gone{background:var(--border);opacity:.4;transform:scaleX(.6)}

/* Solved */
.solved{display:flex;flex-direction:column;gap:6px}
.sv-card{
  border-radius:var(--r);padding:12px 14px;text-align:center;
  animation:svAppear .35s cubic-bezier(.34,1.56,.64,1);
}
.sv-card.d0{background:var(--yellow-bg);color:var(--yellow-t);border-inline-start:4px solid var(--yellow)}
.sv-card.d1{background:var(--green-bg);color:var(--green-t);border-inline-start:4px solid var(--green)}
.sv-card.d2{background:var(--blue-bg);color:var(--blue-t);border-inline-start:4px solid var(--blue)}
.sv-card.d3{background:var(--purple-bg);color:var(--purple-t);border-inline-start:4px solid var(--purple)}
@keyframes svAppear{0%{transform:scaleY(0);opacity:0}100%{transform:scaleY(1);opacity:1}}
.sv-name{font-weight:800;font-size:.76rem;text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px}
[dir=rtl] .sv-name{text-transform:none;letter-spacing:0}
.sv-words{font-size:.74rem;font-weight:600;opacity:.85}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{
  background:var(--card);border:2px solid var(--border);border-radius:var(--r);
  padding:13px 5px;min-height:54px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-weight:700;font-size:.8rem;cursor:pointer;
  transition:all .12s;box-shadow:var(--shadow);line-height:1.25;
  text-transform:uppercase;letter-spacing:.3px;position:relative;
}
[dir=rtl] .tile{
  font-family:'IBM Plex Sans Arabic',sans-serif;
  text-transform:none;letter-spacing:0;font-size:.85rem;font-weight:600;
}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.tile:active{transform:scale(.95)}
.tile.sel{
  background:var(--sel);color:var(--sel-t);border-color:var(--sel);
  transform:scale(1.04);box-shadow:0 4px 16px rgba(0,0,0,.12);
}
.tile.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.tile.one{animation:pOne .5s ease}
@keyframes pOne{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 3px var(--yellow),var(--shadow-lg)}}
.tile.flash{animation:flash .3s ease forwards}
@keyframes flash{0%{transform:scale(1)}50%{transform:scale(1.1);background:var(--green);color:#fff;border-color:var(--green)}100%{transform:scale(.7);opacity:0}}

/* Buttons */
.acts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.btn{
  font-family:inherit;font-weight:700;font-size:.78rem;padding:10px 22px;
  border-radius:24px;cursor:pointer;transition:all .15s;
  border:2px solid var(--text);background:transparent;color:var(--text);
}
[dir=rtl] .btn{font-family:'IBM Plex Sans Arabic',sans-serif}
.btn:hover{background:var(--text);color:var(--bg)}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--text);color:var(--bg)}
.btn.pri:hover{opacity:.85}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.acc:hover{background:var(--accent2)}
.btn:disabled{opacity:.2;cursor:not-allowed;pointer-events:none}

/* Overlay */
.ov{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;pointer-events:none;transition:opacity .4s;
}
.ov.on{opacity:1;pointer-events:auto}
.ov-bg{position:absolute;inset:0;background:var(--bg);opacity:.93}
.ov-box{
  position:relative;z-index:1;background:var(--card);border-radius:var(--r2);
  padding:28px 22px;max-width:380px;width:100%;box-shadow:var(--shadow-lg);
  border:1px solid var(--border);display:flex;flex-direction:column;
  align-items:center;gap:14px;text-align:center;
  animation:ovIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes ovIn{0%{transform:translateY(30px)scale(.95);opacity:0}100%{transform:none;opacity:1}}
.ov-emoji{font-size:3.2rem}
.ov-title{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:900}
[dir=rtl] .ov-title{font-family:'IBM Plex Sans Arabic',sans-serif}
.ov-grid{
  background:var(--bg2);border-radius:var(--r);padding:14px 18px;
  font-size:1.15rem;line-height:1.9;letter-spacing:2px;width:100%;
  white-space:pre-line;
}
.ov-sub{font-size:.8rem;color:var(--text2);font-weight:600}

/* Toast */
.toast{
  position:fixed;top:50px;left:50%;transform:translateX(-50%) translateY(-10px);
  background:var(--text);color:var(--bg);padding:10px 24px;border-radius:8px;
  font-weight:700;font-size:.82rem;z-index:200;opacity:0;pointer-events:none;transition:all .3s;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Tutorial overlay */
.tut{
  position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;
}
.tut.on{opacity:1;pointer-events:auto}
.tut-box{
  background:var(--card);border-radius:var(--r2);padding:28px 24px;
  max-width:400px;width:100%;box-shadow:var(--shadow-lg);
  animation:ovIn .4s cubic-bezier(.34,1.56,.64,1);
}
.tut-box h2{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:900;margin-bottom:14px;text-align:center}
[dir=rtl] .tut-box h2{font-family:'IBM Plex Sans Arabic',sans-serif}
.tut-step{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.tut-num{
  min-width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex-shrink:0;
}
.tut-txt{font-size:.85rem;line-height:1.6;color:var(--text2)}
.tut-txt strong{color:var(--text)}
.tut-colors{display:flex;gap:6px;margin:10px 0}
.tut-c{width:18px;height:18px;border-radius:4px}
.tut-c.c0{background:var(--yellow)}
.tut-c.c1{background:var(--green)}
.tut-c.c2{background:var(--blue)}
.tut-c.c3{background:var(--purple)}
.tut-close{
  display:block;margin:8px auto 0;font-family:inherit;font-weight:700;font-size:.85rem;
  padding:10px 32px;border-radius:24px;border:none;background:var(--accent);color:#fff;cursor:pointer;
}
[dir=rtl] .tut-close{font-family:'IBM Plex Sans Arabic',sans-serif}
.tut-close:hover{background:var(--accent2)}

/* Confetti */
.conf{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.conf-p{
  position:absolute;width:10px;height:10px;top:-10px;
  animation:cFall linear forwards;
}
@keyframes cFall{0%{transform:translateY(0)rotate(0);opacity:1}100%{transform:translateY(110vh)rotate(720deg);opacity:0}}

@media(max-width:380px){
  .tile{font-size:.7rem;padding:10px 3px;min-height:46px}
  [dir=rtl] .tile{font-size:.76rem}
  .hdr h1{font-size:2rem}
}
</style>
</head>

  <div class="acts" id="acts">

    <button class="btn" id="deselBtn">Deselect</button>
    <button class="btn pri" id="subBtn" disabled>Submit</button>
  </div>
  <div class="acts" style="margin-top:2px">
    <button class="btn acc" id="newBtn">✦ New Puzzle</button>
  </div>
</div>

<!-- Result -->
<div class="ov" id="resOv">
  <div class="ov-bg"></div>
  <div class="ov-box">
    <div class="ov-emoji" id="rEmoji"></div>

    <div class="acts">
      <button class="btn" id="shareBtn">📋 Share</button>
      <button class="btn acc" id="againBtn">✦ Next</button>
    </div>
  </div>
</div>

<!-- Tutorial -->
<div class="tut" id="tut"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Confetti -->
<div class="conf" id="conf"></div>

// ===================== SEEDED RANDOM GENERATOR =====================
// Generates "unique" puzzles by combining and remixing from the database
function seededRandom(seed){
  let s=seed;
  return()=>{s=(s*16807+0)%2147483647;return(s-1)/2147483646};
}

function generatePuzzle(lang,diff,seed){
  const pool=DB[lang][diff]||DB[lang].easy;
  const rng=seededRandom(seed);
  // Pick a random puzzle from pool using the seed
  const idx=Math.floor(rng()*pool.length);
  return JSON.parse(JSON.stringify(pool[idx]));
}

const $=id=>document.getElementById(id);

// ===================== TOAST =====================
let toastTimer;
function toast(msg,dur=1500){
  clearTimeout(toastTimer);
  toastEl.textContent=msg;toastEl.classList.add('on');
  toastTimer=setTimeout(()=>toastEl.classList.remove('on'),dur);
}

// ===================== CONFETTI =====================
function confetti(){
  confEl.innerHTML='';
  const cols=['#f59e0b','#22c55e','#3b82f6','#8b5cf6','#ef4444','#ec4899'];
  for(let i=0;i<50;i++){
    const p=document.createElement('div');p.className='conf-p';
    p.style.left=Math.random()*100+'%';
    p.style.background=cols[~~(Math.random()*cols.length)];
    p.style.width=(6+Math.random()*8)+'px';
    p.style.height=(6+Math.random()*8)+'px';
    p.style.borderRadius=Math.random()>.5?'50%':'2px';
    p.style.animationDuration=(2+Math.random()*2)+'s';
    p.style.animationDelay=(Math.random()*.8)+'s';
    confEl.appendChild(p);
  }
  setTimeout(()=>confEl.innerHTML='',5000);
}

// ===================== RENDER =====================
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=~~(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function updateUI(){
  const h=document.documentElement;
  h.lang=lang;h.dir=lang==='ar'?'rtl':'ltr';
  if(theme==='dark')document.body.setAttribute('data-theme','dark');
  else document.body.removeAttribute('data-theme');

  $('sub').textContent=t('sub');
  $('lStreak').textContent=t('streak');$('lSolved').textContent=t('solved');$('lPuzzle').textContent=t('puzzle');
  $('livesLbl').textContent=t('lives');
  shufBtn.textContent=t('shuffle');deselBtn.textContent=t('deselect');subBtn.textContent=t('submit');
  newBtn.textContent=t('newPuzzle');

  $('sStreak').textContent=stats.streak;$('sSolved').textContent=stats.solved;
  $('sPuzzle').textContent='#'+stats.num;
  $('langBtn').textContent=lang==='en'?'ع':'EN';

  // Difficulty
  const dr=$('diffRow');dr.innerHTML='';
  ['easy','medium','hard'].forEach(d=>{
    const b=document.createElement('button');
    b.className='diff-b'+(d===diff?' on':'');
    b.textContent=t(d);
    b.onclick=()=>{diff=d;updateUI()};
    dr.appendChild(b);
  });

  // Lives
  const ld=$('lDots');ld.innerHTML='';
  for(let i=0;i<maxLives;i++){
    const d=document.createElement('span');
    d.className='life'+(i<mistakes?' gone':'');
    ld.appendChild(d);
  }
}

function renderGrid(){
  gridEl.innerHTML='';
  words.filter(w=>!solved.includes(w.group)).forEach(w=>{
    const t=document.createElement('div');
    t.className='tile'+(selected.has(w.word)?' sel':'');
    t.textContent=w.word;
    t.onclick=()=>toggle(w.word);
    gridEl.appendChild(t);
  });
  subBtn.disabled=selected.size!==4;
}

function renderSolved(){
  svArea.innerHTML='';
  solved.forEach(gn=>{
    const g=puzzle.groups.find(x=>x.name===gn);
    if(!g)return;
    const c=document.createElement('div');
    c.className=`sv-card d${g.difficulty}`;
    const sep=lang==='ar'?' ، ':' ,  ';
    c.innerHTML=`<div class="sv-name">${g.name}</div><div class="sv-words">${g.words.join(sep)}</div>`;
    svArea.appendChild(c);
  });
}

// ===================== GAME LOGIC =====================
function toggle(w){
  if(gameOver)return;
  if(selected.has(w))selected.delete(w);
  else if(selected.size<4)selected.add(w);
  renderGrid();
}

function submit(){
  if(selected.size!==4||gameOver)return;
  const sel=[...selected],key=sel.sort().join('|');
  if(prevGuesses.includes(key)){toast(t('tried'));return}
  prevGuesses.push(key);

  const grp={};
  sel.forEach(w=>{const o=words.find(x=>x.word===w);grp[o.group]=(grp[o.group]||0)+1});
  const entries=Object.entries(grp);

  if(entries.length===1&&entries[0][1]===4){
    // Correct!
    const gn=entries[0][0];
    solved.push(gn);

    document.querySelectorAll('.tile.sel').forEach(t=>{t.classList.add('flash')});
    setTimeout(()=>{
      selected.clear();renderSolved();renderGrid();
      if(solved.length===4){
        gameOver=true;stats.streak++;stats.solved++;
        confetti();setTimeout(()=>showResult(true),500);
      }
    },350);
  }else{
    // Wrong
    const mx=Math.max(...entries.map(e=>e[1]));
    if(mx===3){
      toast(t('oneAway'));
      document.querySelectorAll('.tile.sel').forEach(t=>{t.classList.add('one');setTimeout(()=>t.classList.remove('one'),600)});
    }else{
      document.querySelectorAll('.tile.sel').forEach(t=>{t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),500)});
    }
    mistakes++;updateUI();
    if(mistakes>=maxLives){
      gameOver=true;stats.streak=0;
      setTimeout(()=>{
        puzzle.groups.forEach(g=>{if(!solved.includes(g.name))solved.push(g.name)});
        renderSolved();gridEl.innerHTML='';
        setTimeout(()=>showResult(false),400);
      },600);
    }
    selected.clear();renderGrid();
  }
}

function showResult(won){
  $('rEmoji').textContent=won?'🎉':'💪';
  $('rTitle').textContent=won?t('win'):t('lose');

  const em={0:'🟨',1:'🟩',2:'🟦',3:'🟪'};
  const ordered=[...puzzle.groups].sort((a,b)=>solved.indexOf(a.name)-solved.indexOf(b.name));
  let g=`LinkWords #${stats.num}\n`;
  ordered.forEach(x=>g+=em[x.difficulty].repeat(4)+'\n');
  g+=mistakes===0?t('noMistakes'):`${t('mistakesText')}: ${mistakes}/4`;
  $('rGrid').textContent=g;
  $('rSub').textContent=won?`🔥 ${t('streak')}: ${stats.streak}`:'';
  resOv.classList.add('on');
}

function newPuzzle(){
  puzzleSeed=Date.now()+Math.floor(Math.random()*100000);
  stats.num++;
  puzzle=generatePuzzle(lang,diff,puzzleSeed);
  words=[];
  puzzle.groups.forEach(g=>g.words.forEach(w=>words.push({word:w,group:g.name,difficulty:g.difficulty})));
  words=shuffle(words);
  selected.clear();solved=[];mistakes=0;gameOver=false;prevGuesses=[];
  resOv.classList.remove('on');
  svArea.innerHTML='';
  updateUI();renderGrid();
}

// ===================== EVENTS =====================
subBtn.onclick=submit;
shufBtn.onclick=()=>{
  const rem=words.filter(w=>!solved.includes(w.group));
  const sh=shuffle(rem);let i=0;
  words=words.map(w=>solved.includes(w.group)?w:sh[i++]);
  renderGrid();
};
deselBtn.onclick=()=>{selected.clear();renderGrid()};
newBtn.onclick=newPuzzle;
$('againBtn').onclick=newPuzzle;
$('shareBtn').onclick=()=>{
  const txt=$('rGrid').textContent;

};
$('langBtn').onclick=()=>{lang=lang==='en'?'ar':'en';newPuzzle()};
$('themeBtn').onclick=()=>{theme=theme==='light'?'dark':'light';updateUI()};
$('helpBtn').onclick=showTutorial;

})();
