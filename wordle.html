<meta charset="UTF-8">

<title>Wordle — Word Game</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f13;--board:#1a1a24;--cell:#25253a;--cell-border:rgba(255,255,255,0.08);--cell-active:rgba(255,255,255,0.2);--text:#e8e6f0;--text2:rgba(255,255,255,0.5);--accent:#ff6b4a;--accent2:#ffd166;--green:#22c55e;--yellow:#eab308;--gray:#3a3a4a;--key-bg:#3a3a4e;--key-text:#e8e6f0;--border:rgba(255,255,255,0.06);--overlay-bg:rgba(15,15,19,0.88)}
[data-theme="light"]{--bg:#f5f1eb;--board:#e8e0d4;--cell:#fff;--cell-border:rgba(0,0,0,0.15);--cell-active:rgba(0,0,0,0.3);--text:#1a1a24;--text2:rgba(0,0,0,0.4);--green:#6aaa64;--yellow:#c9b458;--gray:#787c7e;--key-bg:#d3d6da;--key-text:#1a1a24;--border:rgba(0,0,0,0.08);--overlay-bg:rgba(245,241,235,0.92)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:12px;user-select:none;-webkit-user-select:none;transition:background .3s,color .3s}
body.ar{font-family:'Noto Sans Arabic','Outfit',sans-serif}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(255,107,74,.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(255,209,102,.04) 0%,transparent 50%);pointer-events:none;z-index:0}
[data-theme="light"] body::before{background:none}
.app{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:500px;flex:1}
.header{display:flex;align-items:center;justify-content:space-between;width:100%;padding-bottom:4px;border-bottom:1px solid var(--border)}
.logo{font-family:'Space Mono',monospace;font-size:1.8rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px}
body.ar .logo{font-family:'Noto Sans Arabic',sans-serif;letter-spacing:0;font-size:1.6rem}
.header-right{display:flex;gap:8px;align-items:center}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:var(--board);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.85rem;transition:all .15s;font-family:inherit;text-decoration:none}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
[data-theme="light"] .icon-btn{border-color:rgba(0,0,0,.12);color:rgba(0,0,0,.4)}
[data-theme="light"] .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.lang-btn{font-weight:700;font-size:.75rem;font-family:'Noto Sans Arabic','Outfit',sans-serif}
.board{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;flex:1;max-height:min(400px,50vh);width:fit-content;margin:4px auto}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
body.ar .row{direction:ltr}
.tile{width:clamp(48px,13vw,62px);height:clamp(48px,13vw,62px);border:2px solid var(--cell-border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:clamp(1.3rem,4.5vw,1.8rem);font-weight:700;text-transform:uppercase;background:transparent;color:var(--text);transition:border-color .1s}
body.ar .tile{font-family:'Noto Sans Arabic',sans-serif;font-size:clamp(1.2rem,4vw,1.6rem);text-transform:none}
.tile.filled{border-color:var(--cell-active);animation:pop .1s ease}
.tile.reveal{animation:flip .5s ease forwards}
.tile.correct{--flip-bg:var(--green);--flip-text:#fff}
.tile.present{--flip-bg:var(--yellow);--flip-text:#fff}
.tile.absent{--flip-bg:var(--gray);--flip-text:#fff}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes flip{0%{transform:rotateX(0);background:transparent}49%{transform:rotateX(90deg);background:transparent}50%{transform:rotateX(90deg);background:var(--flip-bg);color:var(--flip-text);border-color:var(--flip-bg)}100%{transform:rotateX(0);background:var(--flip-bg);color:var(--flip-text);border-color:var(--flip-bg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes bounce{0%,20%{transform:translateY(0)}40%{transform:translateY(-20px)}50%{transform:translateY(5px)}60%{transform:translateY(-10px)}80%{transform:translateY(2px)}100%{transform:translateY(0)}}
.keyboard{display:flex;flex-direction:column;gap:6px;width:100%;max-width:500px;margin-top:auto}
.kb-row{display:flex;justify-content:center;gap:4px}
body.ar .kb-row{direction:ltr}
.key{height:clamp(44px,7vh,56px);min-width:clamp(26px,6.8vw,36px);border-radius:6px;border:none;background:var(--key-bg);color:var(--key-text);font-family:'Outfit',sans-serif;font-size:clamp(.7rem,2vw,.88rem);font-weight:700;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex:1;max-width:42px}
body.ar .key{font-family:'Noto Sans Arabic',sans-serif;font-size:clamp(.8rem,2.2vw,1rem);text-transform:none;min-width:clamp(22px,5.5vw,32px);max-width:36px}
.key.wide{min-width:52px;max-width:62px;font-size:clamp(.6rem,1.8vw,.75rem)}
body.ar .key.wide{min-width:44px;max-width:54px}
.key:active{transform:scale(.93)}
.key.correct{background:var(--green);color:#fff}
.key.present{background:var(--yellow);color:#fff}
.key.absent{background:var(--gray);color:#fff;opacity:.6}
[data-theme="light"] .key.absent{opacity:1;color:#fff}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--text);color:var(--bg);padding:12px 24px;border-radius:8px;font-weight:700;font-size:.85rem;z-index:300;opacity:0;pointer-events:none;transition:all .3s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--overlay-bg);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .35s}
.overlay.on{opacity:1;pointer-events:auto}
.ov-box{background:var(--board);border-radius:18px;border:1px solid var(--border);padding:28px 24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;animation:ovIn .4s cubic-bezier(.34,1.56,.64,1)}
[data-theme="light"] .ov-box{background:#fff;border-color:rgba(0,0,0,.08)}
@keyframes ovIn{0%{transform:translateY(20px)scale(.95);opacity:0}100%{transform:none;opacity:1}}
.ov-emoji{font-size:3rem}
.ov-title{font-family:'Space Mono',monospace;font-size:1.3rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
body.ar .ov-title{font-family:'Noto Sans Arabic',sans-serif}
.ov-stats{background:rgba(255,255,255,.04);border-radius:10px;padding:14px 18px;width:100%;font-family:'Space Mono',monospace;font-size:.85rem;line-height:2;color:var(--text2)}
body.ar .ov-stats{font-family:'Noto Sans Arabic',sans-serif;direction:rtl}
[data-theme="light"] .ov-stats{background:rgba(0,0,0,.04)}
.ov-stats strong{color:var(--accent2)}
.ov-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ov-btn{font-family:'Outfit',sans-serif;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:10px 24px;border:none;border-radius:10px;cursor:pointer;transition:all .2s}
body.ar .ov-btn{font-family:'Noto Sans Arabic',sans-serif;letter-spacing:0}
.ov-btn.primary{background:var(--accent);color:#fff}
.ov-btn.secondary{background:var(--board);color:var(--text);border:1.5px solid var(--border)}
[data-theme="light"] .ov-btn.secondary{background:#f5f1eb}
.ov-btn:hover{filter:brightness(1.15);transform:scale(1.03)}
.modal-overlay{position:fixed;inset:0;background:var(--overlay-bg);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.on{opacity:1;pointer-events:auto}
.modal-box{background:var(--board);border:1px solid var(--border);border-radius:18px;padding:28px 24px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:ovIn .35s cubic-bezier(.34,1.56,.64,1);max-height:85dvh;overflow-y:auto}
body.ar .modal-box{direction:rtl}
[data-theme="light"] .modal-box{background:#fff;border-color:rgba(0,0,0,.08)}
.modal-box h2{font-family:'Space Mono',monospace;font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:18px;text-align:center}
body.ar .modal-box h2{font-family:'Noto Sans Arabic',sans-serif}
[data-theme="light"] .modal-box h2{-webkit-text-fill-color:initial;background:none;color:var(--accent)}
.how-step{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.how-num{min-width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.72rem;flex-shrink:0}
.how-text{font-size:.82rem;line-height:1.6;color:var(--text2)}
.how-text strong{color:var(--text)}
.example-tiles{display:flex;gap:5px;margin:8px 0}
body.ar .example-tiles{direction:ltr}
.ex-tile{width:34px;height:34px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-weight:700;font-size:.9rem;color:#fff}
body.ar .ex-tile{font-family:'Noto Sans Arabic',sans-serif}
.modal-close{display:block;margin:16px auto 0;font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:700;padding:10px 32px;border-radius:10px;border:none;background:var(--accent);color:#fff;cursor:pointer;transition:all .2s}
.modal-close:hover{filter:brightness(1.15)}
.conf{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.conf-p{position:absolute;width:10px;height:10px;top:-10px;animation:cFall linear forwards}
@keyframes cFall{0%{transform:translateY(0)rotate(0);opacity:1}100%{transform:translateY(110vh)rotate(720deg);opacity:0}}
@media(max-width:360px){.tile{width:44px;height:44px;font-size:1.1rem}.key{height:40px;min-width:22px;font-size:.65rem}}
</style>

"stale","stash","stead","steed","sting","stink","stoic","stoke","stomp","stoop","stork","stout","strut","stump","stung","stunk","suave","swarm","swine","swirl","swoon","tacit","talon","tangy","taunt","tepid","thief","thigh","thorn","tiara","timid","topaz","torso","trout","tulip","tunic","twang","tweed","ulcer","uncut","undue","unfit","untie","usher","valet","vapor","vegan","viper","visor","vodka","wacky","waltz","whack","whiff","whirl","wield","windy","wince","witty","woken","woozy","wreck","wrist","zesty","zippy","llama","otter"]);

const AR_EXTRA=new Set(["فكرة","لغوي","عربي","نصري","فتحي","عمري","خالد","سمير","نبيل","جليل","رفيق","صديق","حبيب","قريب","نسيب","جاري","ضيفي","زائر","قادم","مسافر","مفيد","لازم","واجب","ممكن","معرو","مجهو","محبو","مطلو","ممنو","منظم","مرتب","نظيف","رطبي","معتد","مشمس","غائم","ممطر","عاصف","ثلجي","رعدي","جليد","كتبي","درسي","علمي","فهمي","حفظي","تذكر","فكري","حلمي","امير","سلطا","ملكي","نبوي","ديني","دنيا","اخرة","توبة","رحمة","نعمة","بركة","هداي","ضلال","ايمن","يسار","وسطي","اعلى","اسفل","امام","خلفي","فوقي","تحتي","يمين","شمال","طاهر","فاسد","حلال","حرام","مباح","فرضي","سنية","نافل","مستح","مكرو"]);

const ALL_EN=new Set([...EN_WORDS,...EN_EXTRA]);
const ALL_AR=new Set([...AR_WORDS,...AR_EXTRA]);

const KB_EN=[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['Enter','z','x','c','v','b','n','m','Backspace']];
const KB_AR=[['ض','ص','ث','ق','ف','غ','ع','ه','خ','ح','ج','د'],['ش','س','ي','ب','ل','ا','ت','ن','م','ك','ط'],['Enter','ئ','ء','ؤ','ر','ذ','ى','ة','و','ز','ظ','Backspace']];

let lang='en',answer,guesses,currentGuess,currentRow,gameOver,keyStates,wordList,validSet,kbLayout;

function setLang(l){
  lang=l;
  document.body.classList.toggle('ar',lang==='ar');
  wordList=lang==='en'?EN_WORDS:AR_WORDS;
  validSet=lang==='en'?ALL_EN:ALL_AR;
  kbLayout=lang==='en'?KB_EN:KB_AR;
  document.getElementById('logoText').textContent=i18n[lang].title;
  document.getElementById('langBtn').textContent=lang==='en'?'ع':'EN';
  document.getElementById('langBtn').title=lang==='en'?'العربية':'English';
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=i18n[lang][el.dataset.i18n]||el.textContent});
  buildHelp();
  newGame();
}

function pickWord(){return wordList[Math.floor(Math.random()*wordList.length)]}

function newGame(){
  answer=pickWord();
  guesses=[];currentGuess='';currentRow=0;gameOver=false;keyStates={};
  document.getElementById('resultOv').classList.remove('on');
  buildBoard();buildKeyboard();
}

const boardEl=document.getElementById('board');
const toastEl=document.getElementById('toast');
const confEl=document.getElementById('conf');

function buildBoard(){
  boardEl.innerHTML='';
  for(let r=0;r<6;r++){const row=document.createElement('div');row.className='row';row.id='row'+r;
    for(let c=0;c<5;c++){const t=document.createElement('div');t.className='tile';t.id='t'+r+c;row.appendChild(t)}
    boardEl.appendChild(row)}
}

function buildKeyboard(){
  const kb=document.getElementById('keyboard');kb.innerHTML='';
  kbLayout.forEach(rk=>{const rd=document.createElement('div');rd.className='kb-row';
    rk.forEach(k=>{const b=document.createElement('button');b.className='key'+(k==='Enter'||k==='Backspace'?' wide':'');
      b.dataset.key=k;b.textContent=k==='Backspace'?'⌫':k==='Enter'?'⏎':k;
      b.addEventListener('click',()=>handleKey(k));rd.appendChild(b)});
    kb.appendChild(rd)});
}

function buildHelp(){
  const t=i18n[lang];let h='<h2>'+t.helpTitle+'</h2>';
  t.helpSteps.forEach((s,i)=>{h+='<div class="how-step"><div class="how-num">'+(i+1)+'</div><div class="how-text">'+s+'</div></div>'});
  h+='<button class="modal-close" id="helpClose">'+t.gotIt+'</button>';
  document.getElementById('helpContent').innerHTML=h;
  document.getElementById('helpClose').addEventListener('click',()=>document.getElementById('helpModal').classList.remove('on'));
}

function getChars(s){return[...s]}

function updateTile(r,c,l){const t=document.getElementById('t'+r+c);t.textContent=l;t.classList.toggle('filled',l!=='')}

function showToast(m,d){clearTimeout(showToast._t);toastEl.textContent=m;toastEl.classList.add('on');showToast._t=setTimeout(()=>toastEl.classList.remove('on'),d||1500)}

function confetti(){confEl.innerHTML='';const c=['#ff6b4a','#ffd166','#22c55e','#3b82f6','#8b5cf6','#ec4899'];
  for(let i=0;i<50;i++){const p=document.createElement('div');p.className='conf-p';p.style.left=Math.random()*100+'%';
    p.style.background=c[~~(Math.random()*c.length)];p.style.width=(6+Math.random()*8)+'px';p.style.height=(6+Math.random()*8)+'px';
    p.style.borderRadius=Math.random()>.5?'50%':'2px';p.style.animationDuration=(2+Math.random()*2)+'s';p.style.animationDelay=(Math.random()*.8)+'s';
    confEl.appendChild(p)}setTimeout(()=>confEl.innerHTML='',5000)}

function handleKey(key){
  if(gameOver)return;const t=i18n[lang];
  if(key==='Backspace'){const ch=getChars(currentGuess);ch.pop();currentGuess=ch.join('');updateTile(currentRow,ch.length,'');return}
  if(key==='Enter'){const ch=getChars(currentGuess);if(ch.length<5){showToast(t.notEnough);shakeRow();return}if(!validSet.has(currentGuess)){showToast(t.notValid);shakeRow();return}submitGuess();return}
  const ch=getChars(currentGuess);if(ch.length>=5)return;
  if(lang==='en'&&/^[a-z]$/.test(key)){currentGuess+=key;updateTile(currentRow,ch.length,key)}
  else if(lang==='ar'){currentGuess+=key;updateTile(currentRow,ch.length,key)}
}

function shakeRow(){const r=document.getElementById('row'+currentRow);r.style.animation='shake .5s';setTimeout(()=>r.style.animation='',500)}

function submitGuess(){
  const guess=currentGuess,gc=getChars(guess),ac=getChars(answer),result=evalGuess(gc,ac);
  guesses.push({word:guess,chars:gc,result});
  const row=document.getElementById('row'+currentRow),tiles=row.children;
  for(let i=0;i<5;i++){((i)=>{setTimeout(()=>{tiles[i].classList.add('reveal',result[i])},i*300)})(i)}
  setTimeout(()=>{
    for(let i=0;i<5;i++){const l=gc[i],s=result[i],p={absent:0,present:1,correct:2};
      if(!keyStates[l]||p[s]>p[keyStates[l]])keyStates[l]=s;
      const ke=document.querySelector('[data-key="'+CSS.escape(l)+'"]');
      if(ke)ke.className='key'+(keyStates[l]?' '+keyStates[l]:'')}
    if(guess===answer){gameOver=true;bounceRow(currentRow);confetti();setTimeout(showResult,1800)}
    else if(currentRow>=5){gameOver=true;setTimeout(showResult,1600)}
    currentRow++;currentGuess='';
  },5*300+300);
}

function evalGuess(gc,ac){
  const r=Array(5).fill('absent'),a=[...ac],g=[...gc];
  for(let i=0;i<5;i++){if(g[i]===a[i]){r[i]='correct';a[i]=null;g[i]=null}}
  for(let i=0;i<5;i++){if(!g[i])continue;const x=a.indexOf(g[i]);if(x!==-1){r[i]='present';a[x]=null}}
  return r;
}

function bounceRow(ri){const t=document.getElementById('row'+ri).children;
  for(let i=0;i<5;i++){setTimeout(()=>{t[i].style.animation='bounce .5s ease';setTimeout(()=>t[i].style.animation='',500)},i*100)}}

function showResult(){
  const t=i18n[lang],won=guesses.length>0&&guesses[guesses.length-1].word===answer;
  document.getElementById('resEmoji').textContent=won?'🎉':'😔';
  document.getElementById('resTitle').textContent=won?t.win[guesses.length-1]:t.lose;
  const ad=lang==='ar'?answer:answer.toUpperCase();
  document.getElementById('resStats').innerHTML=won?t.wordWas+' <strong>'+ad+'</strong><br>'+t.solvedIn+' <strong>'+guesses.length+'/6</strong> '+t.guesses:t.wordWas+' <strong>'+ad+'</strong>';
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=i18n[lang][el.dataset.i18n]||el.textContent});
  document.getElementById('resultOv').classList.add('on');
}

function getShareText(){
  const t=i18n[lang],won=guesses.length>0&&guesses[guesses.length-1].word===answer;
  const em={correct:'🟩',present:'🟨',absent:'⬛'},ll=lang==='ar'?'عربي':'EN';
  let tx='🟩 Wordle ('+ll+') — '+(won?guesses.length:'X')+'/6\n\n';
  guesses.forEach(g=>{tx+=g.result.map(r=>em[r]).join('')+'\n'});
  tx+='\nhttps://gamearcade.github.io/arcade-hub/wordle.html';return tx;
}

const arKeyMap={'q':'ض','w':'ص','e':'ث','r':'ق','t':'ف','y':'غ','u':'ع','i':'ه','o':'خ','p':'ح','[':'ج',']':'د','a':'ش','s':'س','d':'ي','f':'ب','g':'ل','h':'ا','j':'ت','k':'ن','l':'م',';':'ك','\'':'ط','z':'ئ','x':'ء','c':'ؤ','v':'ر','b':'ذ','n':'ى','m':'ة',',':'و','.':'ز','/':'ظ'};

document.addEventListener('keydown',e=>{
  if(gameOver)return;
  if(e.key==='Enter'){handleKey('Enter');e.preventDefault();return}
  if(e.key==='Backspace'){handleKey('Backspace');e.preventDefault();return}
  if(lang==='en'){if(/^[a-zA-Z]$/.test(e.key))handleKey(e.key.toLowerCase())}
  else{if(/[\u0600-\u06FF]/.test(e.key))handleKey(e.key);
    else if(/^[a-zA-Z]$/.test(e.key)){const m=arKeyMap[e.key.toLowerCase()];if(m)handleKey(m)}}
});

document.getElementById('shareBtn').addEventListener('click',()=>{
  const tx=getShareText();if(navigator.clipboard)navigator.clipboard.writeText(tx).then(()=>showToast(i18n[lang].copied))});
document.getElementById('playAgainBtn').addEventListener('click',newGame);
document.getElementById('langBtn').addEventListener('click',()=>setLang(lang==='en'?'ar':'en'));
document.getElementById('helpBtn').addEventListener('click',()=>document.getElementById('helpModal').classList.add('on'));
document.getElementById('helpModal').addEventListener('click',e=>{if(e.target===document.getElementById('helpModal'))document.getElementById('helpModal').classList.remove('on')});
document.getElementById('themeBtn').addEventListener('click',()=>{
  const l=document.documentElement.getAttribute('data-theme')==='light';
  if(l)document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme','light')});

setLang('en');
})();
</script>
